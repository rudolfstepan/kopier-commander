[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kopier-commander"
version = "0.1.0"
description = "Keyboard-friendly two-pane file copy manager with saved tasks and SHA-256 verification"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Rudolf Stepan"}]
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment :: File Managers",
    "Topic :: System :: Filesystems",
]

[project.gui-scripts]
kopier-commander = "kopier_commander.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kopier_commander = ["assets/*.png", "assets/*.ico"]
